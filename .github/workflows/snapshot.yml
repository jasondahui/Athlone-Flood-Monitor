name: Hourly data snapshot
on:
  schedule:
    - cron: '23 * * * *'   # every hour at :23 (UTC)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public data
        run: bash scripts/snapshot.sh
      - name: Publish to the data branch (single commit, force-pushed, so history doesn't grow)
        run: |
          mkdir -p /tmp/out && cp data/snapshot.json /tmp/out/
          cd /tmp/out
          git init -q -b data
          git config user.name "snapshot-bot"
          git config user.email "snapshot-bot@users.noreply.github.com"
          git add snapshot.json
          git commit -q -m "Data snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data:data
